<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1120;
    --surface: #121a2e;
    --surface-hover: #182238;
    --border: #23304a;
    --text: #e8edf5;
    --text-dim: #7c8aab;
    --k8s-blue: #4d8fe6;
    --status-green: #4ade80;
    --amber: #e6b34d;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Inter', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    background-image:
      linear-gradient(rgba(77,143,230,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77,143,230,0.05) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--text);
    font-family: var(--sans);
  }
  a { color: inherit; text-decoration: none; }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(11,17,32,0.9);
    backdrop-filter: blur(6px);
    z-index: 10;
  }
  .logo { font-family: var(--mono); font-weight: 700; font-size: 18px; }
  .logo span { color: var(--k8s-blue); }
  .nav-links { display: flex; gap: 28px; font-size: 14px; color: var(--text-dim); }
  .nav-links a:hover { color: var(--text); }

  .hero {
    max-width: 760px;
    margin: 0 auto;
    padding: 96px 24px 64px;
    text-align: center;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--status-green);
    background: rgba(74,222,128,0.08);
    border: 1px solid rgba(74,222,128,0.25);
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 24px;
  }
  .eyebrow-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--status-green); }
  .hero h1 {
    font-family: var(--mono);
    font-size: 42px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.02em;
  }
  .hero h1
