<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoreo y Observabilidad desde cero · Lección 2 - Prometheus básico</title>
<style>
:root{
  --bg:#0b1020; --grid:rgba(255,255,255,0.045);
  --card:#131a2c; --card-border:rgba(255,255,255,0.09);
  --blue:#5b8def; --blue-light:#7ba7f5;
  --text:#e8ecf5; --dim:#8b95ab;
  --red:#f16a6a; --amber:#f2c14e; --green:#6ee7a0;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:40px 40px;
  min-height:100vh;
}
.mono{font-family:"JetBrains Mono","Fira Code",ui-monospace,Menlo,Consolas,monospace;}
a{color:inherit;text-decoration:none;}
.topbar{
  display:flex; align-items:center; gap:24px;
  padding:20px 32px; border-bottom:1px solid var(--card-border);
}
.hearts{color:var(--red); font-weight:700; display:flex; align-items:center; gap:6px;}
.xp{color:var(--amber); font-weight:700; display:flex; align-items:center; gap:6px;}
.progress{flex:1; height:10px; background:var(--card); border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; background:var(--blue); width:0%; transition:width .3s ease; border-radius:6px;}
.nav{display:flex; align-items:center; justify-content:space-between; padding:20px 32px; border-bottom:1px solid var(--card-border);}
.logo{font-weight:700; font-size:18px; display:flex; align-items:center; gap:10px;}
.back{color:var(--dim); font-size:14px;}
.container{max-width:900px; margin:0 auto; padding:64px 24px;}
.kicker{color:var(--blue-light); font-size:13px; letter-spacing:.08em; margin-bottom:16px; font-weight:700;}
h1{font-size:32px; line-height:1.35; margin:0 0 32px 0;}
.badge{
  display:inline-flex; align-items:center; gap:8px; color:var(--green);
  border:1px solid rgba(110,231,160,.35); border-radius:999px; padding:8px 16px;
  font-size:13px; margin-bottom:24px;
}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
.option{
  display:block; width:100%; text-align:left; background:var(--card);
  border:1px solid var(--card-border); color:var(--text); border-radius:12px;
  padding:22px 24px; margin-bottom:16px; font-size:18px; cursor:pointer;
  font-family:"JetBrains Mono","Fira Code",ui-monospace,Menlo,Consolas,monospace;
  transition:border-color .15s ease, background .15s ease;
}
.option:hover{border-color:var(--blue);}
.option.selected{border-color:var(--blue); background:#182140;}
input.textin, textarea.textin{
  width:100%; background:var(--card); border:1px solid var(--card-border);
  color:var(--text); border-radius:12px; padding:18px 20px; font-size:17px;
  font-family:"JetBrains Mono","Fira Code",ui-monospace,Menlo,Consolas,monospace;
  margin-bottom:16px;
}
textarea.textin{min-height:120px; resize:vertical;}
.feedback{margin:12px 0 4px 0; font-size:14px; min-height:20px;}
.feedback.ok{color:var(--green);}
.feedback.bad{color:var(--red);}
.actions{display:flex; justify-content:flex-end; margin-top:24px;}
.btn{
  background:var(--blue); color:#fff; border:none; border-radius:10px;
  padding:16px 36px; font-size:16px; font-weight:700; cursor:pointer;
  font-family:"JetBrains Mono","Fira Code",ui-monospace,Menlo,Consolas,monospace;
}
.btn:hover{background:var(--blue-light);}
.btn.secondary{background:transparent; border:1px solid var(--card-border); color:var(--text);}
.center{text-align:center;}
.check{font-size:56px; color:var(--green); margin-bottom:16px;}
.done-title{font-family:"JetBrains Mono","Fira Code",ui-monospace,Menlo,Consolas,monospace; font-weight:800; font-size:36px; margin:0 0 12px 0;}
.done-sub{color:var(--dim); font-size:18px; margin-bottom:48px;}
.stats{display:flex; gap:24px; justify-content:center; margin-bottom:40px; flex-wrap:wrap;}
.stat-card{background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:24px 40px; min-width:220px;}
.stat-inner{background:var(--bg); border:1px solid var(--card-border); border-radius:12px; padding:24px; margin-bottom:16px;}
.stat-value{font-family:"JetBrains Mono","Fira Code",ui-monospace,Menlo,Consolas,monospace; font-size:32px; font-weight:800;}
.stat-label{font-family:"JetBrains Mono","Fira Code",ui-monospace,Menlo,Consolas,monospace; color:var(--dim); font-size:12px; letter-spacing:.05em; margin-top:12px;}
.done-actions{display:flex; gap:16px; justify-content:center; flex-wrap:wrap;}
.hub-item{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  background:var(--card); border:1px solid var(--card-border); border-left:3px solid var(--blue);
  border-radius:10px; padding:26px 28px; margin-bottom:18px;
}
.hub-num{font-family:"JetBrains Mono","Fira Code",ui-monospace,Menlo,Consolas,monospace; color:var(--dim); font-size:15px; width:32px;}
.hub-text{flex:1; font-size:18px;}
.hub-text b{margin-right:10px;}
.hub-text .desc{color:var(--dim); font-size:15px; font-family:"JetBrains Mono","Fira Code",ui-monospace,Menlo,Consolas,monospace;}
.arrow{color:var(--dim); font-size:20px;}
</style>
</head>
<body>
<div class="topbar">
  <div class="hearts">&#9829; <span id="hearts">3</span></div>
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  <div class="xp">&#9889; <span id="xp">0</span></div>
</div>
<div class="container" id="app"></div>
<script>
const questions = [{"type": "mc", "q": "¿Cómo obtiene Prometheus sus métricas por defecto?", "options": ["Los servicios se las envían (push)", "Prometheus las recolecta activamente (pull/scraping)", "Por email", "Por FTP"], "answer": "Prometheus las recolecta activamente (pull/scraping)"}, {"type": "mc", "q": "¿En qué base de datos guarda Prometheus sus métricas?", "options": ["MySQL", "Una base de series temporales (TSDB) propia", "MongoDB", "PostgreSQL"], "answer": "Una base de series temporales (TSDB) propia"}, {"type": "fill", "q": "Completa la extensión típica del archivo de configuración principal de Prometheus:", "prefix": "prometheus.", "answer": "yml"}];
const LESSON_NUM = 2;
const LESSON_TITLE = "Prometheus básico";
const COURSE_KICKER = "MONITOREO Y OBSERVABILIDAD DESDE CERO";
const NEXT_HREF = "monitoreo-leccion-promql.html";
const NEXT_LABEL = "Lección 3: PromQL →";
const HUB_HREF = "curso-monitoreo.html";

let current = 0, hearts = 3, xp = 0, selected = null;

function renderQuestion() {
  const q = questions[current];
  document.getElementById('progressFill').style.width = (current / questions.length * 100) + '%';
  const app = document.getElementById('app');
  let body = '';

  if (q.type === 'mc') {
    body = q.options.map((opt, i) =>
      `<button class="option" data-i="${i}" onclick="selectOption(${i})">${opt}</button>`
    ).join('');
  } else if (q.type === 'fill') {
    body = `<div class="mono" style="font-size:18px;margin-bottom:16px;">
      ${q.prefix ? q.prefix : ''}<input type="text" class="textin" id="fillInput" style="width:220px;display:inline-block;">${q.suffix ? q.suffix : ''}
    </div>`;
  } else if (q.type === 'write') {
    body = `<textarea class="textin" id="writeInput" placeholder="Escribe tu respuesta aquí..."></textarea>`;
  }

  app.innerHTML = `
    <div class="kicker">${COURSE_KICKER} &middot; LECCI&Oacute;N ${LESSON_NUM}</div>
    <h1>${q.q}</h1>
    ${body}
    <div class="feedback" id="feedback"></div>
    <div class="actions"><button class="btn" onclick="checkAnswer()">Comprobar</button></div>
  `;
  selected = null;
}

function selectOption(i) {
  selected = i;
  document.querySelectorAll('.option').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
  });
}

function checkAnswer() {
  const q = questions[current];
  let ok = false;

  if (q.type === 'mc') {
    if (selected === null) return;
    ok = q.options[selected] === q.answer;
  } else if (q.type === 'fill') {
    const val = document.getElementById('fillInput').value.trim();
    ok = val.toLowerCase() === q.answer.toLowerCase();
  } else if (q.type === 'write') {
    const val = document.getElementById('writeInput').value.toLowerCase();
    ok = q.must.some(term => val.includes(term.toLowerCase()));
  }

  const fb = document.getElementById('feedback');
  if (ok) {
    fb.textContent = 'Correcto';
    fb.className = 'feedback ok';
    xp += 3;
    document.getElementById('xp').textContent = xp;
    setTimeout(() => {
      current++;
      if (current >= questions.length) {
        renderDone();
      } else {
        renderQuestion();
      }
    }, 500);
  } else {
    fb.textContent = 'Casi. Intenta de nuevo.';
    fb.className = 'feedback bad';
    hearts = Math.max(0, hearts - 1);
    document.getElementById('hearts').textContent = hearts;
  }
}

function renderDone() {
  document.getElementById('progressFill').style.width = '100%';
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="center">
      <div class="check">&#10003;</div>
      <h2 class="done-title">&iexcl;Lecci&oacute;n completada!</h2>
      <div class="done-sub">Ya sabes ${LESSON_TITLE.toLowerCase()}.</div>
      <div class="stats">
        <div class="stat-card">
          <div class="stat-inner"><div class="stat-value">${xp}</div></div>
          <div class="stat-label">XP GANADO</div>
        </div>
        <div class="stat-card">
          <div class="stat-inner"><div class="stat-value">${hearts}</div></div>
          <div class="stat-label">VIDAS RESTANTES</div>
        </div>
      </div>
      <div class="done-actions">
        <a class="btn secondary" href="${HUB_HREF}">Volver al curso</a>
        <a class="btn" href="${NEXT_HREF}">${NEXT_LABEL}</a>
      </div>
    </div>
  `;
}

renderQuestion();
</script>
</body>
</html>
