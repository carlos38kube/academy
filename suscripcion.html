<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suscríbete · Jivops</title>
<script async src="https://js.stripe.com/v3/pricing-table.js"></script>
<style>
  :root {
    --bg: #0b1120;
    --surface: #121a2e;
    --border: #23304a;
    --text: #e8edf5;
    --text-dim: #7c8aab;
    --accent: #4d8fe6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 16px;
  }
  .header {
    max-width: 900px;
    margin: 0 auto 32px;
    text-align: center;
  }
  .icon { font-size: 40px; margin-bottom: 12px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: var(--text-dim); line-height: 1.5; margin: 0 auto; max-width: 520px; }
  .back {
    display: block;
    text-align: center;
    margin-top: 28px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 14px;
  }
  .back:hover { color: var(--text); }
  #table-container { max-width: 900px; margin: 0 auto; min-height: 200px; }
  .loading { text-align: center; color: var(--text-dim); padding: 40px; }
</style>
</head>
<body>
  <div class="header">
    <div class="icon">🔒</div>
    <h1>Contenido avanzado</h1>
    <p>Este curso forma parte del contenido avanzado de Jivops. Suscríbete para desbloquear los 34 cursos completos, con 30 lecciones y PDF cada uno.</p>
  </div>

  <div id="table-container">
    <div class="loading">Cargando planes…</div>
  </div>

  <a class="back" href="index.html">← Volver al inicio</a>

  <script>
    var token = localStorage.getItem('jivops_token');
    if (!token) {
      window.location.href = 'login.html';
    } else {
      fetch('https://api.jivops.com/me', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
        .then(function (res) {
          if (!res.ok) throw new Error('unauthorized');
          return res.json();
        })
        .then(function (user) {
          var container = document.getElementById('table-container');
          container.innerHTML =
            '<stripe-pricing-table pricing-table-id="prctbl_1UAcEhF1X8P443Ck8ku13cSG" ' +
            'publishable-key="pk_live_51U8PQtF1X8P443CkniVBOBGSlQtbMl9fDqOD5AGjdTmoaHG1MMmqlK03awaFBcxqNosig62wjfpwPzOKpZA8rz4900ou3rAioA" ' +
            'client-reference-id="' + user.id + '" ' +
            'customer-email="' + user.email + '">' +
            '</stripe-pricing-table>';
        })
        .catch(function () {
          localStorage.removeItem('jivops_token');
          window.location.href = 'login.html';
        });
    }
  </script>
</body>
</html>
